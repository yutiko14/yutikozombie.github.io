<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зомби. Нахуй. Выживание.</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f0b;overflow:hidden;font-family:system-ui,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{background:#121a12;border:2px solid #2a3a2a;border-radius:8px;cursor:crosshair;max-width:100%;max-height:100%}
  
  #hud{position:fixed;top:10px;left:12px;color:#cfe8cf;font-size:14px;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5;display:none}
  #hud .bonus{color:#ff6b6b;font-weight:bold;display:none;}
  #hud .difficulty{color:#ffaa00;font-weight:bold;display:none;}
  #hud .ult-ready { color: #ffcc00; font-weight: bold; text-shadow: 0 0 10px #ffcc00; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  
  #boss-hud { position:fixed; top:10px; left:50%; transform:translateX(-50%); width: 50%; min-width: 300px; text-align: center; color: #fff; display: none; z-index: 5; pointer-events: none; }
  #boss-name { font-size: 20px; font-weight: bold; color: #ff3333; text-shadow: 0 0 10px #ff0000; margin-bottom: 5px; letter-spacing: 2px;}
  #boss-bar-bg { width: 100%; height: 15px; background: rgba(0,0,0,0.7); border: 2px solid #ff3333; border-radius: 5px; overflow: hidden; }
  #boss-bar-fill { height: 100%; background: linear-gradient(90deg, #ff0000, #ff8800); width: 100%; transition: width 0.2s; }

  #menu, #gameover { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background: #0b0f0b; color:#e8ffe8; z-index: 10; }
  #menu.hidden, #gameover.hidden { display: none; }
  #menu h1 { font-size: 48px; margin: 0 0 20px; text-align: center; line-height: 1.1; color: #7cff7c; text-shadow: 0 0 20px #3a7a3a; }
  #menu p { opacity: 0.7; margin-bottom: 30px; font-size: 18px; }
  
  .btn { padding: 15px 40px; border: 2px solid #3d5a3d; background: #1c2a1c; color: #dfffdf; border-radius: 8px; font-size: 20px; cursor: pointer; transition: 0.2s; font-weight: bold; text-transform: uppercase; }
  .btn:hover { background: #243824; border-color: #7cff7c; box-shadow: 0 0 15px #7cff7c; }
  .tg-link { position: fixed; bottom: 20px; left: 20px; color: #6b8a6b; text-decoration: none; font-size: 16px; font-family: monospace; transition: 0.2s; }
  .tg-link:hover { color: #7cff7c; text-shadow: 0 0 10px #7cff7c; }
  #levelup-msg { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; color: #ff5c5c; font-weight: bold; text-shadow: 0 0 20px #ff0000; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 5; text-align: center; }
</style>
</head>
<body>

<div id="menu">
  <h1>Зомби.<br>Нахуй.<br>Выживание.</h1>
  <p>Убей их всех. Или умри.</p>
  <button class="btn" id="playBtn">Играть</button>
</div>

<div id="gameover" class="hidden">
  <h1 style="font-size: 40px; color: #ff5c5c; margin-bottom: 10px;">Ты съеден 🧟</h1>
  <p style="font-size: 20px; margin: 5px 0;">Убито зомби: <b id="finalKills">0</b></p>
  <p style="font-size: 20px; margin: 5px 0;">Волна: <b id="finalWave">1</b></p>
  <button class="btn" id="restartBtn" style="margin-top: 30px;">Заново</button>
</div>

<a href="https://t.me/yutiko" target="_blank" class="tg-link">t.me/yutiko</a>

<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>

<div id="boss-hud">
  <div id="boss-name">ФРИЧ</div>
  <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
</div>

<div id="hud">
  <div>❤ <span id="hp">120</span> / <span id="maxHp">120</span> | Реген: <span id="regenDisplay">0.2</span></div>
  <div>💀 Убито: <span id="kills">0</span></div>
  <div>🌊 Волна: <span id="wave">1</span></div>
  <div>⚡ Сложность: <span id="difficulty">1</span></div>
  <div>🎯 До бонуса: <span id="nextBonus">20</span></div>
  <div id="ultHud">💥 Ульта: <span id="ultCharge">0</span> / 67</div>
  <div class="bonus" id="bonusHud">🔥 РАЖ: <span id="bonusTimer">0</span>с</div>
  <div class="difficulty" id="diffHud" style="color:#ffaa00; display:none;">⚠️ СЛОЖНОСТЬ ПОВЫШЕНА!</div>
</div>

<div id="levelup-msg">СЛОЖНОСТЬ ПОВЫШЕНА!</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const ui = {
    hp: document.getElementById('hp'), maxHp: document.getElementById('maxHp'),
    regenDisplay: document.getElementById('regenDisplay'),
    kills: document.getElementById('kills'), wave: document.getElementById('wave'),
    difficulty: document.getElementById('difficulty'), nextBonus: document.getElementById('nextBonus'),
    bonusHud: document.getElementById('bonusHud'), bonusTimer: document.getElementById('bonusTimer'),
    diffHud: document.getElementById('diffHud'), ultHud: document.getElementById('ultHud'),
    ultCharge: document.getElementById('ultCharge'), menu: document.getElementById('menu'),
    gameover: document.getElementById('gameover'), hud: document.getElementById('hud'),
    playBtn: document.getElementById('playBtn'), restartBtn: document.getElementById('restartBtn'),
    finalKills: document.getElementById('finalKills'), finalWave: document.getElementById('finalWave'),
    levelupMsg: document.getElementById('levelup-msg'), bossHud: document.getElementById('boss-hud'),
    bossName: document.getElementById('boss-name'), bossBarFill: document.getElementById('boss-bar-fill'),
  };

  // --- AUDIO ENGINE ---
  const AudioEngine = {
    ctx: null, masterGain: null, musicGain: null, isInitialized: false, musicInterval: null,
    init() { if (this.isInitialized) return; const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = 0.5; this.masterGain.connect(this.ctx.destination); this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.15; this.musicGain.connect(this.masterGain); this.isInitialized = true; },
    playShoot() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const gain=this.ctx.createGain(); osc.type='square'; osc.frequency.setValueAtTime(600,t); osc.frequency.exponentialRampToValueAtTime(100,t+0.1); gain.gain.setValueAtTime(0.15,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); osc.connect(gain); gain.connect(this.masterGain); osc.start(t); osc.stop(t+0.1); },
    playHit() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const gain=this.ctx.createGain(); osc.type='triangle'; osc.frequency.setValueAtTime(150,t); osc.frequency.exponentialRampToValueAtTime(50,t+0.1); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); osc.connect(gain); gain.connect(this.masterGain); osc.start(t); osc.stop(t+0.1); },
    playExplosion() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const bS=this.ctx.sampleRate*0.5; const buf=this.ctx.createBuffer(1,bS,this.ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<bS;i++)d[i]=Math.random()*2-1; const n=this.ctx.createBufferSource(); n.buffer=buf; const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(1000,t); f.frequency.exponentialRampToValueAtTime(100,t+0.4); const g=this.ctx.createGain(); g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.4); n.connect(f); f.connect(g); g.connect(this.masterGain); const o=this.ctx.createOscillator(); const og=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(80,t); o.frequency.exponentialRampToValueAtTime(20,t+0.5); og.gain.setValueAtTime(0.5,t); og.gain.exponentialRampToValueAtTime(0.01,t+0.5); o.connect(og); og.connect(this.masterGain); n.start(t); o.start(t); o.stop(t+0.5); },
    playZombieDeath() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const gain=this.ctx.createGain(); osc.type='sawtooth'; osc.frequency.setValueAtTime(100,t); osc.frequency.exponentialRampToValueAtTime(30,t+0.15); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.15); osc.connect(gain); gain.connect(this.masterGain); osc.start(t); osc.stop(t+0.15); },
    playFrenzy() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const gain=this.ctx.createGain(); osc.type='sawtooth'; osc.frequency.setValueAtTime(200,t); osc.frequency.linearRampToValueAtTime(800,t+0.3); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); osc.connect(gain); gain.connect(this.masterGain); osc.start(t); osc.stop(t+0.3); },
    playLevelUp() { if(!this.isInitialized)return; const t=this.ctx.currentTime; [400,600,800].forEach((f,i)=>{const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.type='square';osc.frequency.setValueAtTime(f,t+i*0.1);gain.gain.setValueAtTime(0.15,t+i*0.1);gain.gain.exponentialRampToValueAtTime(0.01,t+i*0.1+0.1);osc.connect(gain);gain.connect(this.masterGain);osc.start(t+i*0.1);osc.stop(t+i*0.1+0.1);}); },
    playMedkit() { if(!this.isInitialized)return; const t=this.ctx.currentTime; [500,700,1000].forEach((f,i)=>{const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,t+i*0.08);gain.gain.setValueAtTime(0.2,t+i*0.08);gain.gain.exponentialRampToValueAtTime(0.01,t+i*0.08+0.15);osc.connect(gain);gain.connect(this.masterGain);osc.start(t+i*0.08);osc.stop(t+i*0.08+0.15);}); },
    playPerk() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const gain=this.ctx.createGain(); osc.type='triangle'; osc.frequency.setValueAtTime(300,t); osc.frequency.exponentialRampToValueAtTime(900,t+0.2); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.connect(gain); gain.connect(this.masterGain); osc.start(t); osc.stop(t+0.2); },
    playLightning() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const bS=this.ctx.sampleRate*0.3; const buf=this.ctx.createBuffer(1,bS,this.ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<bS;i++)d[i]=Math.random()*2-1; const n=this.ctx.createBufferSource(); n.buffer=buf; const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1000; const g=this.ctx.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.3); n.connect(f); f.connect(g); g.connect(this.masterGain); n.start(t); },
    playStasShoot() { if(!this.isInitialized)return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const gain=this.ctx.createGain(); osc.type='sine'; osc.frequency.setValueAtTime(300,t); osc.frequency.exponentialRampToValueAtTime(50,t+0.2); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.connect(gain); gain.connect(this.masterGain); osc.start(t); osc.stop(t+0.2); },
    playUlt() { if(!this.isInitialized)return; const t=this.ctx.currentTime; [200,400,600,1000].forEach((f,i)=>{const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(f,t+i*0.05);gain.gain.setValueAtTime(0.2,t+i*0.05);gain.gain.exponentialRampToValueAtTime(0.01,t+i*0.05+0.2);osc.connect(gain);gain.connect(this.masterGain);osc.start(t+i*0.05);osc.stop(t+i*0.05+0.2);}); },
    startMusic() { if(!this.isInitialized)return; this.stopMusic(); this.musicInterval=setInterval(()=>{if(!this.ctx||this.ctx.state==='suspended')return;const t=this.ctx.currentTime;const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.type='triangle';const notes=[55,55,65,55];const note=notes[Math.floor(t*2)%notes.length];osc.frequency.setValueAtTime(note,t);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(0.2,t+0.05);gain.gain.exponentialRampToValueAtTime(0.01,t+0.4);osc.connect(gain);gain.connect(this.musicGain);osc.start(t);osc.stop(t+0.4);},500); },
    stopMusic() { if(this.musicInterval){clearInterval(this.musicInterval);this.musicInterval=null;} },
    resume() { if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); }
  };

  // --- GAME STATE ---
  const state = {
    running: false, over: false,
    hp: 120, maxHp: 120, regen: 0.2, // Стартовое HP 120
    kills: 0, wave: 1, difficulty: 1,
    waveTimer: 0, spawnTimer: 0,
    itemTimer: 1.5, medkitTimer: 4, perkTimer: 4,
    player: { x: W/2, y: H/2, r: 14, speed: 260 },
    zombies: [], miniBosses: [], boss: null,
    bullets: [], enemyBullets: [], particles: [],
    items: [], medkits: [], perks: [], lightningStrikes: [],
    keys: {}, mouse: { x: W/2, y: H/2, down: false },
    lastShot: 0, shootCooldown: 140, baseCooldown: 140, bonusCooldown: 70,
    frenzyTime: 0, frenzyActive: false,
    buffs: { speed: 0, armor: 0, damage: 0, firerate: 0, regenPerk: 0 },
    screenFlash: 0, cameraShake: 0, t: 0,
    nextBonusKill: 20, nextDiffKill: 200,
    
    ultCharge: 0, ultMax: 67, ultActive: false, ultTimer: 0, ultSpikeTimer: 0,
    bossCycle: 0, // Счетчик циклов боссов
  };

  function startGame() {
    AudioEngine.init(); AudioEngine.resume(); AudioEngine.startMusic();
    if (document.activeElement) document.activeElement.blur();

    state.running = true; state.over = false;
    state.hp = 120; state.maxHp = 120; state.regen = 0.2;
    state.kills = 0; state.wave = 1; state.difficulty = 1;
    state.waveTimer = 0; state.spawnTimer = 0;
    state.itemTimer = 1.5; state.medkitTimer = 4; state.perkTimer = 4;
    state.zombies = []; state.miniBosses = []; state.boss = null;
    state.bullets = []; state.enemyBullets = []; state.particles = [];
    state.items = []; state.medkits = []; state.perks = []; state.lightningStrikes = [];
    state.player.x = W/2; state.player.y = H/2;
    state.lastShot = 0; state.shootCooldown = state.baseCooldown;
    state.frenzyTime = 0; state.frenzyActive = false;
    state.buffs = { speed: 0, armor: 0, damage: 0, firerate: 0, regenPerk: 0 };
    state.screenFlash = 0; state.cameraShake = 0;
    state.nextBonusKill = 20; state.nextDiffKill = 200;
    state.keys = {};
    
    state.ultCharge = 0; state.ultActive = false; state.ultTimer = 0; state.ultSpikeTimer = 0;
    state.bossCycle = 0;

    ui.menu.classList.add('hidden'); ui.gameover.classList.add('hidden');
    ui.hud.style.display = 'block'; ui.bonusHud.style.display = 'none';
    ui.diffHud.style.display = 'none'; ui.bossHud.style.display = 'none';
    ui.levelupMsg.style.opacity = 0;
    syncHud();
  }

  function syncHud() {
    ui.hp.textContent = Math.max(0, Math.round(state.hp));
    ui.maxHp.textContent = Math.round(state.maxHp);
    ui.regenDisplay.textContent = state.regen.toFixed(2);
    ui.kills.textContent = state.kills;
    ui.wave.textContent = state.wave;
    ui.difficulty.textContent = state.difficulty;
    ui.nextBonus.textContent = Math.max(0, state.nextBonusKill - state.kills);
    ui.ultCharge.textContent = state.ultCharge;
    
    if (state.ultCharge >= state.ultMax && !state.ultActive) {
      ui.ultHud.className = 'ult-ready';
      ui.ultHud.innerHTML = `💥 УЛЬТА ГОТОВА [3]`;
    } else if (state.ultActive) {
      ui.ultHud.className = 'ult-ready';
      ui.ultHud.innerHTML = `💥 УЛЬТА АКТИВНА!`;
    } else {
      ui.ultHud.className = '';
      ui.ultHud.innerHTML = `💥 Ульта: <span id="ultCharge">${state.ultCharge}</span> / ${state.ultMax}`;
    }

    if (state.frenzyActive) {
      ui.bonusHud.style.display = 'block';
      ui.bonusTimer.textContent = Math.ceil(state.frenzyTime);
    } else {
      ui.bonusHud.style.display = 'none';
    }
  }

  window.addEventListener('keydown', e => {
    const code = e.code;
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyR', 'Space', 'Digit3', 'Numpad3'].includes(code)) e.preventDefault();
    state.keys[code] = true;
    if (code === 'KeyR' && state.running) startGame();
    if ((code === 'Digit3' || code === 'Numpad3') && state.running && !state.over) {
      if (state.ultCharge >= state.ultMax && !state.ultActive) activateUlt();
    }
  });
  window.addEventListener('keyup', e => { state.keys[e.code] = false; });
  window.addEventListener('blur', () => { state.keys = {}; state.mouse.down = false; });

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    state.mouse.x = (e.clientX - r.left) * (W / r.width);
    state.mouse.y = (e.clientY - r.top) * (H / r.height);
  });
  canvas.addEventListener('mousedown', e => { if (e.button === 0) state.mouse.down = true; });
  window.addEventListener('mouseup', e => { if (e.button === 0) state.mouse.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  ui.playBtn.addEventListener('click', startGame);
  ui.restartBtn.addEventListener('click', startGame);

  // --- ИГРОВАЯ ЛОГИКА ---
  function spawnZombie() {
    const side = Math.floor(Math.random() * 4); let x, y;
    if (side === 0) { x = Math.random() * W; y = -30; } else if (side === 1) { x = W + 30; y = Math.random() * H; } else if (side === 2) { x = Math.random() * W; y = H + 30; } else { x = -30; y = Math.random() * H; }
    const diffMult = 1 + (state.difficulty - 1) * 0.12; 
    const hp = (35 + state.wave * 14) * diffMult;
    state.zombies.push({ x, y, r: 12 + Math.min(6, state.wave * 0.4), hp, maxHp: hp, speed: (45 + state.wave * 6 + Math.random() * 20) * diffMult, dmg: (8 + state.wave * 1.0) * diffMult, hitFlash: 0 });
  }

  function spawnMiniBoss() {
    const side = Math.floor(Math.random() * 4); let x, y;
    if (side === 0) { x = Math.random() * W; y = -50; } else if (side === 1) { x = W + 50; y = Math.random() * H; } else if (side === 2) { x = Math.random() * W; y = H + 50; } else { x = -50; y = Math.random() * H; }
    const hp = 350 + state.wave * 50 + state.difficulty * 100;
    state.miniBosses.push({ x, y, r: 25, hp, maxHp: hp, speed: 60 + state.wave * 4, dmg: 15 + state.wave * 2, hitFlash: 0 });
  }

  function spawnBoss() {
    // Цикличность: 5 - СТАС, 10 - ФРИЧ, 15 - ЮТИКО, 20 - СНОВА СТАС (но сильнее)
    const cycleWave = state.wave % 15 || 15; // 5, 10, 15...
    
    // Вычисляем множитель для повторных боссов
    const bossMultiplier = 1 + Math.floor((state.wave - 1) / 15) * 0.5; // +50% HP и урона за каждый цикл

    if (state.wave === 5 || state.wave === 20 || state.wave === 35) {
      state.boss = { 
        type: 'STAS', x: W/2, y: -50, r: 40, 
        hp: 1500 * bossMultiplier, maxHp: 1500 * bossMultiplier, 
        speed: 50 + state.wave, dmg: 15 * bossMultiplier, 
        hitFlash: 0, attackTimer: 1.5 
      };
      ui.bossName.textContent = 'СТАС' + (state.wave > 5 ? ` (УР. ${Math.floor(state.wave/15) + 1})` : ''); 
      ui.bossName.style.color = '#a0522d';
    } else if (state.wave === 10 || state.wave === 25 || state.wave === 40) {
      state.boss = { 
        type: 'FRICH', x: W/2, y: -50, r: 50, 
        hp: 2500 * bossMultiplier, maxHp: 2500 * bossMultiplier, 
        speed: 40 + state.wave, dmg: 20 * bossMultiplier, 
        hitFlash: 0, attackTimer: 2 
      };
      ui.bossName.textContent = 'ФРИЧ' + (state.wave > 10 ? ` (УР. ${Math.floor(state.wave/15) + 1})` : ''); 
      ui.bossName.style.color = '#ff3333';
    } else if (state.wave === 15 || state.wave === 30 || state.wave === 45) {
      state.boss = { 
        type: 'YUTIKO', x: W/2, y: -50, r: 35, 
        hp: 3500 * bossMultiplier, maxHp: 3500 * bossMultiplier, 
        speed: 120 + state.wave, dmg: 15 * bossMultiplier, 
        hitFlash: 0, attackTimer: 0.6, dashTimer: 3 
      };
      ui.bossName.textContent = 'yutiko' + (state.wave > 15 ? ` (УР. ${Math.floor(state.wave/15) + 1})` : ''); 
      ui.bossName.style.color = '#00ffff';
    }
    ui.bossHud.style.display = 'block'; ui.bossBarFill.style.width = '100%'; AudioEngine.playLevelUp(); state.screenFlash = 1;
  }

  function spawnItem() { let x,y,d; do{x=50+Math.random()*(W-100);y=50+Math.random()*(H-100);d=Math.hypot(x-state.player.x,y-state.player.y);}while(d<100); const isMega = Math.random() < 0.3; state.items.push({x,y,r:12,pulse:0, isMega}); }
  function spawnMedkit() { let x,y,d; do{x=50+Math.random()*(W-100);y=50+Math.random()*(H-100);d=Math.hypot(x-state.player.x,y-state.player.y);}while(d<80); state.medkits.push({x,y,r:12,pulse:0}); }

    for (let i = state.enemyBullets.length - 1; i >= 0; i--) { const eb = state.enemyBullets[i]; eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt; if (Math.hypot(p.x - eb.x, p.y - eb.y) < p.r + eb.r) { if (state.ultActive) { state.enemyBullets.splice(i, 1); continue; } let fd = eb.dmg; if (state.buffs.armor > 0) fd *= 0.5; state.hp -= fd; state.screenFlash = Math.max(state.screenFlash, 0.5); AudioEngine.playHit(); state.enemyBullets.splice(i, 1); if (state.hp <= 0) { state.hp = 0; gameOver(); } continue; } if (eb.life <= 0 || eb.x < -20 || eb.x > W + 20 || eb.y < -20 || eb.y > H + 20) state.enemyBullets.splice(i, 1); }

    for (const mk of state.medkits) { const pulse = 1 + Math.sin(mk.pulse) * 0.15; ctx.fillStyle = '#f0f0f0'; ctx.fillRect(mk.x - mk.r * pulse, mk.y - mk.r * pulse, mk.r * 2 * pulse, mk.r * 2 * pulse); ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.strokeRect(mk.x - mk.r * pulse, mk.y - mk.r * pulse, mk.r * 2 * pulse, mk.r * 2 * pulse); ctx.fillStyle = '#ff3333'; ctx.fillRect(mk.x - 2, mk.y - 6, 4, 12); ctx.fillRect(mk.x - 6, mk.y - 2, 12, 4); }
    for (const perk of state.perks) { const pulse = 1 + Math.sin(perk.pulse) * 0.2; ctx.fillStyle = '#d946ef'; ctx.shadowColor = '#d946ef'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(perk.x, perk.y, perk.r * pulse, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (perk.type === 'speed') ctx.fillText('👟', perk.x, perk.y); if (perk.type === 'armor') ctx.fillText('🛡️', perk.x, perk.y); if (perk.type === 'damage') ctx.fillText('🔫', perk.x, perk.y); if (perk.type === 'firerate') ctx.fillText('💥', perk.x, perk.y); if (perk.type === 'regenPerk') ctx.fillText('+', perk.x, perk.y); }

    for (const ls of state.lightningStrikes) { if (!ls.struck) { ctx.beginPath(); ctx.arc(ls.x, ls.y, 60, 0, Math.PI*2); ctx.fillStyle = `rgba(255, 0, 0, ${0.2 + Math.sin(state.t * 20) * 0.1})`; ctx.fill(); ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2; ctx.stroke(); } else { ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 4; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.moveTo(ls.x, ls.y - 300); ctx.lineTo(ls.x - 10, ls.y - 150); ctx.lineTo(ls.x + 15, ls.y - 80); ctx.lineTo(ls.x - 5, ls.y); ctx.stroke(); ctx.shadowBlur = 0; } }

    for (const b of state.bullets) { if (b.isSpike) { ctx.fillStyle = '#ffcc00'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; } else { ctx.fillStyle = state.frenzyActive ? '#ffaa00' : '#ffe066'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); } }
    for (const eb of state.enemyBullets) { if (eb.isPoop) { ctx.fillStyle = '#8b4513'; ctx.shadowColor = '#8b4513'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; } else { ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; } }

    for (const z of state.zombies) { ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : '#5cbf5c'; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#2a5a2a'; ctx.lineWidth = 2; ctx.stroke(); const w = z.r * 2; const hpFrac = z.hp / z.maxHp; ctx.fillStyle = '#3a0f0f'; ctx.fillRect(z.x - z.r, z.y - z.r - 8, w, 4); ctx.fillStyle = '#ff5c5c'; ctx.fillRect(z.x - z.r, z.y - z.r - 8, w * hpFrac, 4); }

    for (const mb of state.miniBosses) { ctx.fillStyle = mb.hitFlash > 0 ? '#ffffff' : '#a020f0'; ctx.shadowColor = '#d946ef'; ctx.shadowBlur = 15; ctx.beginPath(); ctx.arc(mb.x, mb.y, mb.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#d946ef'; ctx.lineWidth = 3; ctx.stroke(); const w = mb.r * 2; const hpFrac = mb.hp / mb.maxHp; ctx.fillStyle = '#3a0f0f'; ctx.fillRect(mb.x - mb.r, mb.y - mb.r - 8, w, 4); ctx.fillStyle = '#d946ef'; ctx.fillRect(mb.x - mb.r, mb.y - mb.r - 8, w * hpFrac, 4); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mb.x - 8, mb.y - 5, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(mb.x + 8, mb.y - 5, 4, 0, Math.PI*2); ctx.fill(); }

    if (state.boss) {
      const b = state.boss;
      if (b.type === 'STAS') {
        ctx.fillStyle = b.hitFlash > 0 ? '#ffffff' : '#e0e0e0'; ctx.shadowColor = '#a0522d'; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#a0522d'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#e0e0e0'; ctx.beginPath(); ctx.ellipse(b.x - 20, b.y - 50, 10, 25, -0.3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(b.x + 20, b.y - 50, 10, 25, 0.3, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#a0522d'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(b.x - 12, b.y - 10, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(b.x + 12, b.y - 10, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 10, b.y + 10, 6, 10); ctx.fillRect(b.x + 4, b.y + 10, 6, 10); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(b.x - 10, b.y + 10, 6, 10); ctx.strokeRect(b.x + 4, b.y + 10, 6, 10);
      } else {
        ctx.fillStyle = b.hitFlash > 0 ? '#ffffff' : (b.type === 'FRICH' ? '#8b0000' : '#0055ff'); ctx.shadowColor = b.type === 'FRICH' ? '#ff0000' : '#00ffff'; ctx.shadowBlur = 30;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = b.type === 'FRICH' ? '#ff0000' : '#00ffff'; ctx.lineWidth = 4; ctx.stroke();
        if (b.type === 'FRICH') { ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(b.x - 15, b.y - 10, 6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(b.x + 15, b.y - 10, 6, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y + 10, 15, 0, Math.PI); ctx.stroke(); }
        else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x - 10, b.y - 5, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(b.x + 10, b.y - 5, 4, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + (state.player.x - b.x) * 0.5, b.y + (state.player.y - b.y) * 0.5); ctx.stroke(); }
      }
    }

    const p = state.player;
    if (state.frenzyActive) { ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 20; }
    if (state.ultActive) { ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 30; }
    ctx.fillStyle = state.ultActive ? '#ffcc00' : (state.frenzyActive ? '#ff4d4d' : '#4aa8ff');
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = state.ultActive ? '#ffaa00' : (state.frenzyActive ? '#aa0000' : '#1b5a99'); ctx.lineWidth = 2; ctx.stroke();

    if (state.buffs.armor > 0) { ctx.strokeStyle = 'rgba(100, 200, 255, 0.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI*2); ctx.stroke(); }
    if (state.buffs.speed > 0) { ctx.strokeStyle = 'rgba(100, 255, 100, 0.5)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]); }

    const dx = state.mouse.x - p.x, dy = state.mouse.y - p.y; const len = Math.hypot(dx, dy) || 1;
    ctx.strokeStyle = state.frenzyActive ? '#ffcc00' : '#bfe3ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + dx/len * (p.r + 10), p.y + dy/len * (p.r + 10)); ctx.stroke();
    ctx.strokeStyle = state.frenzyActive ? 'rgba(255,100,100,.8)' : 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(state.mouse.x, state.mouse.y, 7, 0, Math.PI*2); ctx.moveTo(state.mouse.x - 12, state.mouse.y); ctx.lineTo(state.mouse.x + 12, state.mouse.y); ctx.moveTo(state.mouse.x, state.mouse.y - 12); ctx.lineTo(state.mouse.x, state.mouse.y + 12); ctx.stroke();

    const barW = 220, barH = 14; const bx = 16, by = H - 30;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = state.hp > 30 ? '#4ade80' : '#f87171'; ctx.fillRect(bx, by, barW * (state.hp / state.maxHp), barH);
    ctx.strokeStyle = '#2a3a2a'; ctx.strokeRect(bx, by, barW, barH);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.fillText(`HP: ${Math.round(state.hp)}/${Math.round(state.maxHp)}`, bx + 5, by - 5);

    ctx.restore();
    if (state.screenFlash > 0) { ctx.fillStyle = `rgba(255, 50, 50, ${state.screenFlash * 0.4})`; ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  draw();
})();
</script>
</body>
</html>
