<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зомби. Нахуй. Выживание.</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f0b;overflow:hidden;font-family:system-ui,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{background:#121a12;border:2px solid #2a3a2a;border-radius:8px;cursor:crosshair;max-width:100%;max-height:100%}
  
  #hud{position:fixed;top:10px;left:12px;color:#cfe8cf;font-size:14px;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5;display:none}
  #hud .bonus{color:#ff6b6b;font-weight:bold;display:none;}
  #hud .difficulty{color:#ffaa00;font-weight:bold;display:none;}
  #boss-hud {
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    width: 50%; min-width: 300px; text-align: center;
    color: #fff; display: none; z-index: 5; pointer-events: none;
  }
  #boss-name { font-size: 20px; font-weight: bold; color: #ff3333; text-shadow: 0 0 10px #ff0000; margin-bottom: 5px; letter-spacing: 2px;}
  #boss-bar-bg { width: 100%; height: 15px; background: rgba(0,0,0,0.7); border: 2px solid #ff3333; border-radius: 5px; overflow: hidden; }
  #boss-bar-fill { height: 100%; background: linear-gradient(90deg, #ff0000, #ff8800); width: 100%; transition: width 0.2s; }

  #menu, #gameover {
    position:fixed; inset:0; 
    display:flex; flex-direction:column; 
    align-items:center; justify-content:center; 
    background: #0b0f0b; color:#e8ffe8; 
    z-index: 10;
  }
  #menu.hidden, #gameover.hidden { display: none; }

  #menu h1 {
    font-size: 48px; margin: 0 0 20px; 
    text-align: center; line-height: 1.1;
    color: #7cff7c; text-shadow: 0 0 20px #3a7a3a;
  }
  #menu p { opacity: 0.7; margin-bottom: 30px; font-size: 18px; }
  
  .btn {
    padding: 15px 40px; border: 2px solid #3d5a3d; 
    background: #1c2a1c; color: #dfffdf; 
    border-radius: 8px; font-size: 20px; 
    cursor: pointer; transition: 0.2s;
    font-weight: bold; text-transform: uppercase;
  }
  .btn:hover { background: #243824; border-color: #7cff7c; box-shadow: 0 0 15px #7cff7c; }

  .tg-link {
    position: fixed; bottom: 20px; left: 20px;
    color: #6b8a6b; text-decoration: none; 
    font-size: 16px; font-family: monospace;
    transition: 0.2s;
  }
  .tg-link:hover { color: #7cff7c; text-shadow: 0 0 10px #7cff7c; }

  #levelup-msg {
    position: fixed; top: 30%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px; color: #ff5c5c; font-weight: bold;
    text-shadow: 0 0 20px #ff0000;
    pointer-events: none; opacity: 0;
    transition: opacity 0.5s;
    z-index: 5; text-align: center;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Зомби.<br>Нахуй.<br>Выживание.</h1>
  <p>Убей их всех. Или умри.</p>
  <button class="btn" id="playBtn">Играть</button>
</div>

<div id="gameover" class="hidden">
  <h1 style="font-size: 40px; color: #ff5c5c; margin-bottom: 10px;">Ты съеден 🧟</h1>
  <p style="font-size: 20px; margin: 5px 0;">Убито зомби: <b id="finalKills">0</b></p>
  <p style="font-size: 20px; margin: 5px 0;">Волна: <b id="finalWave">1</b></p>
  <button class="btn" id="restartBtn" style="margin-top: 30px;">Заново</button>
</div>

<a href="https://t.me/yutiko" target="_blank" class="tg-link">t.me/yutiko</a>

<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>

<!-- HUD Босса -->
<div id="boss-hud">
  <div id="boss-name">ФРИЧ</div>
  <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
</div>

<div id="hud">
  <div>❤ <span id="hp">100</span></div>
  <div>💀 Убито: <span id="kills">0</span></div>
  <div>🌊 Волна: <span id="wave">1</span></div>
  <div>🎯 До бонуса: <span id="nextBonus">20</span></div>
  <div class="bonus" id="bonusHud">🔥 РАЖ: <span id="bonusTimer">0</span>с</div>
  <div class="difficulty" id="diffHud" style="color:#ffaa00; display:none;">⚠️ СЛОЖНОСТЬ ПОВЫШЕНА!</div>
</div>

<div id="levelup-msg">СЛОЖНОСТЬ ПОВЫШЕНА!</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const ui = {
    hp: document.getElementById('hp'),
    kills: document.getElementById('kills'),
    wave: document.getElementById('wave'),
    nextBonus: document.getElementById('nextBonus'),
    bonusHud: document.getElementById('bonusHud'),
    bonusTimer: document.getElementById('bonusTimer'),
    diffHud: document.getElementById('diffHud'),
    menu: document.getElementById('menu'),
    gameover: document.getElementById('gameover'),
    hud: document.getElementById('hud'),
    playBtn: document.getElementById('playBtn'),
    restartBtn: document.getElementById('restartBtn'),
    finalKills: document.getElementById('finalKills'),
    finalWave: document.getElementById('finalWave'),
    levelupMsg: document.getElementById('levelup-msg'),
    bossHud: document.getElementById('boss-hud'),
    bossBarFill: document.getElementById('boss-bar-fill'),
  };

  // --- AUDIO ENGINE ---
  const AudioEngine = {
    ctx: null,
    masterGain: null,
    musicGain: null,
    isInitialized: false,
    musicInterval: null,

    init() {
      if (this.isInitialized) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.5;
      this.masterGain.connect(this.ctx.destination);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.15;
      this.musicGain.connect(this.masterGain);
      this.isInitialized = true;
    },

    playShoot() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.1);
    },

    playHit() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.1);
    },

    playExplosion() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.5;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const noiseFilter = this.ctx.createBiquadFilter();
      noiseFilter.type = 'lowpass';
      noiseFilter.frequency.setValueAtTime(1000, t);
      noiseFilter.frequency.exponentialRampToValueAtTime(100, t + 0.4);
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.4, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(this.masterGain);
      
      const osc = this.ctx.createOscillator();
      const oscGain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(80, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.5);
      oscGain.gain.setValueAtTime(0.5, t);
      oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
      osc.connect(oscGain);
      oscGain.connect(this.masterGain);
      noise.start(t);
      osc.start(t);
      osc.stop(t + 0.5);
    },

    playZombieDeath() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.15);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.15);
    },

    playFrenzy() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.linearRampToValueAtTime(800, t + 0.3);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.3);
    },

    playLevelUp() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      [400, 600, 800].forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, t + i * 0.1);
        gain.gain.setValueAtTime(0.15, t + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.1 + 0.1);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t + i * 0.1);
        osc.stop(t + i * 0.1 + 0.1);
      });
    },

    playMedkit() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      [500, 700, 1000].forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t + i * 0.08);
        gain.gain.setValueAtTime(0.2, t + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.08 + 0.15);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t + i * 0.08);
        osc.stop(t + i * 0.08 + 0.15);
      });
    },

    playPerk() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.exponentialRampToValueAtTime(900, t + 0.2);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + 0.2);
    },

    playLightning() {
      if (!this.isInitialized) return;
      const t = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.3;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1000;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.masterGain);
      noise.start(t);
    },

    startMusic() {
      if (!this.isInitialized) return;
      this.stopMusic();
      this.musicInterval = setInterval(() => {
        if (!this.ctx || this.ctx.state === 'suspended') return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        const notes = [55, 55, 65, 55];
        const note = notes[Math.floor(t * 2) % notes.length];
        osc.frequency.setValueAtTime(note, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc.connect(gain);
        gain.connect(this.musicGain);
        osc.start(t);
        osc.stop(t + 0.4);
      }, 500);
    },

    stopMusic() {
      if (this.musicInterval) {
        clearInterval(this.musicInterval);
        this.musicInterval = null;
      }
    },

    resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
  };

  // --- GAME STATE ---
  const state = {
    running: false,
    over: false,
    hp: 100,
    maxHp: 100,
    kills: 0,
    wave: 1,
    waveTimer: 0,
    spawnTimer: 0,
    itemTimer: 5,
    medkitTimer: 10,
    perkTimer: 15,
    player: { x: W/2, y: H/2, r: 14, speed: 220 },
    zombies: [],
    boss: null,
    bullets: [],
    particles: [],
    items: [],     // бомбы
    medkits: [],   // аптечки
    perks: [],     // усиления
    lightningStrikes: [],
    keys: {},
    mouse: { x: W/2, y: H/2, down: false },
    lastShot: 0,
    shootCooldown: 140,
    baseCooldown: 140,
    bonusCooldown: 70,
    frenzyTime: 0,
    frenzyActive: false,
    
    // Активные баффы игрока
    buffs: { speed: 0, armor: 0, damage: 0, firerate: 0 },
    
    screenFlash: 0,
    cameraShake: 0,
    t: 0,
    nextBonusKill: 20,
  };

  function startGame() {
    AudioEngine.init();
    AudioEngine.resume();
    AudioEngine.startMusic();

    if (document.activeElement) document.activeElement.blur();

    state.running = true;
    state.over = false;
    state.hp = state.maxHp;
    state.kills = 0;
    state.wave = 1;
    state.waveTimer = 0;
    state.spawnTimer = 0;
    state.itemTimer = 5;
    state.medkitTimer = 10;
    state.perkTimer = 15;
    state.zombies = [];
    state.boss = null;
    state.bullets = [];
    state.particles = [];
    state.items = [];
    state.medkits = [];
    state.perks = [];
    state.lightningStrikes = [];
    state.player.x = W/2;
    state.player.y = H/2;
    state.lastShot = 0;
    state.shootCooldown = state.baseCooldown;
    state.frenzyTime = 0;
    state.frenzyActive = false;
    state.buffs = { speed: 0, armor: 0, damage: 0, firerate: 0 };
    state.screenFlash = 0;
    state.cameraShake = 0;
    state.nextBonusKill = 20;
    state.keys = {};

    ui.menu.classList.add('hidden');
    ui.gameover.classList.add('hidden');
    ui.hud.style.display = 'block';
    ui.bonusHud.style.display = 'none';
    ui.diffHud.style.display = 'none';
    ui.bossHud.style.display = 'none';
    ui.levelupMsg.style.opacity = 0;
    
    syncHud();
  }

  function syncHud() {
    ui.hp.textContent = Math.max(0, Math.round(state.hp));
    ui.kills.textContent = state.kills;
    ui.wave.textContent = state.wave;
    ui.nextBonus.textContent = Math.max(0, state.nextBonusKill - state.kills);
    
    if (state.frenzyActive) {
      ui.bonusHud.style.display = 'block';
      ui.bonusTimer.textContent = Math.ceil(state.frenzyTime);
    } else {
      ui.bonusHud.style.display = 'none';
    }
  }

  // --- Input ---
  window.addEventListener('keydown', e => {
    const code = e.code;
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyR', 'Space'].includes(code)) {
      e.preventDefault();
    }
    state.keys[code] = true;
    if (code === 'KeyR' && state.running) startGame();
  });

  window.addEventListener('keyup', e => {
    state.keys[e.code] = false;
  });

  window.addEventListener('blur', () => {
    state.keys = {};
    state.mouse.down = false;
  });

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    state.mouse.x = (e.clientX - r.left) * (W / r.width);
    state.mouse.y = (e.clientY - r.top) * (H / r.height);
  });
  canvas.addEventListener('mousedown', e => { if (e.button === 0) state.mouse.down = true; });
  window.addEventListener('mouseup', e => { if (e.button === 0) state.mouse.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  ui.playBtn.addEventListener('click', startGame);
  ui.restartBtn.addEventListener('click', startGame);

  // --- Spawn ---
  function spawnZombie() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -30; }
    else if (side === 1) { x = W + 30; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + 30; }
    else { x = -30; y = Math.random() * H; }

    const hp = 30 + state.wave * 12;
    state.zombies.push({
      x, y,
      r: 12 + Math.min(6, state.wave * 0.4),
      hp, maxHp: hp,
      speed: 45 + state.wave * 6 + Math.random() * 20,
      dmg: 7 + state.wave * 1.0,
      hitFlash: 0,
    });
  }

  function spawnBoss() {
    state.boss = {
      x: W/2, y: -50,
      r: 50,
      hp: 1500, maxHp: 1500,
      speed: 35,
      dmg: 20,
      hitFlash: 0,
      attackTimer: 2,
    };
    ui.bossHud.style.display = 'block';
    AudioEngine.playLevelUp();
    state.screenFlash = 1;
  }

  function spawnItem() {
    let x, y, dist;
    do {
      x = 50 + Math.random() * (W - 100);
      y = 50 + Math.random() * (H - 100);
      dist = Math.hypot(x - state.player.x, y - state.player.y);
    } while (dist < 100);
    state.items.push({ x, y, r: 12, pulse: 0 });
  }

  function spawnMedkit() {
    let x, y, dist;
    do {
      x = 50 + Math.random() * (W - 100);
      y = 50 + Math.random() * (H - 100);
      dist = Math.hypot(x - state.player.x, y - state.player.y);
    } while (dist < 80);
    state.medkits.push({ x, y, r: 12, pulse: 0 });
  }

  function spawnPerk() {
    let x, y, dist;
    do {
      x = 50 + Math.random() * (W - 100);
      y = 50 + Math.random() * (H - 100);
      dist = Math.hypot(x - state.player.x, y - state.player.y);
    } while (dist < 100);
    
    const types = ['speed', 'armor', 'damage', 'firerate'];
    const type = types[Math.floor(Math.random() * types.length)];
    state.perks.push({ x, y, r: 12, pulse: 0, type });
  }

  function explodeItem(item) {
    AudioEngine.playExplosion();
    const radius = 100;
    const damageRadius = 150;
    const damage = 100 + state.wave * 50;

    for (let i = state.zombies.length - 1; i >= 0; i--) {
      const z = state.zombies[i];
      const d = Math.hypot(z.x - item.x, z.y - item.y);
      if (d < radius) {
        state.kills++;
        state.zombies.splice(i, 1);
        for (let k = 0; k < 10; k++) {
          state.particles.push({ x: z.x, y: z.y, vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300, life: 0.6, maxLife: 0.6, color: '#ffaa00' });
        }
        checkProgress();
      } else if (d < damageRadius) {
        z.hp -= damage;
        z.hitFlash = 1;
        if (z.hp <= 0) {
          state.kills++;
          state.zombies.splice(i, 1);
          checkProgress();
        }
      }
    }
    
    if (state.boss) {
      const d = Math.hypot(state.boss.x - item.x, state.boss.y - item.y);
      if (d < damageRadius) {
        state.boss.hp -= damage;
        state.boss.hitFlash = 1;
        ui.bossBarFill.style.width = Math.max(0, (state.boss.hp / state.boss.maxHp) * 100) + '%';
      }
    }

    for (let k = 0; k < 30; k++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 200;
      state.particles.push({ x: item.x, y: item.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0.8, maxLife: 0.8, color: Math.random() > 0.5 ? '#ffaa00' : '#ff5c5c' });
    }

    state.screenFlash = Math.max(state.screenFlash, 0.8);
    state.cameraShake = Math.max(state.cameraShake, 2);
    syncHud();
  }

  function checkProgress() {
    if (state.kills >= state.nextBonusKill) activateFrenzy();
  }

  function shoot() {
    const now = performance.now();
    let cd = state.frenzyActive ? state.bonusCooldown : state.baseCooldown;
    if (state.buffs.firerate > 0) cd *= 0.6; // Ускорение стрельбы от перка

    if (now - state.lastShot < cd) return;
    state.lastShot = now;

    AudioEngine.playShoot();

    const p = state.player;
    const dx = state.mouse.x - p.x;
    const dy = state.mouse.y - p.y;
    const len = Math.hypot(dx, dy) || 1;
    const speed = 720;
    
    let dmg = 18;
    if (state.buffs.damage > 0) dmg *= 2; // Двойной урон

    state.bullets.push({
      x: p.x + dx/len * (p.r + 4),
      y: p.y + dy/len * (p.r + 4),
      vx: dx/len * speed,
      vy: dy/len * speed,
      r: 3,
      life: 1.2,
      dmg: dmg
    });
  }

  function update(dt) {
    if (!state.running || state.over) return;
    state.t += dt;

    if (state.screenFlash > 0) state.screenFlash -= dt * 2;
    if (state.cameraShake > 0) state.cameraShake -= dt * 3;

    // Таймеры баффов
    for (let key in state.buffs) {
      if (state.buffs[key] > 0) state.buffs[key] -= dt;
    }

    if (state.frenzyActive) {
      state.frenzyTime -= dt;
      if (state.frenzyTime <= 0) {
        state.frenzyActive = false;
        state.frenzyTime = 0;
      }
    }

    const p = state.player;
    let mx = 0, my = 0;
    if (state.keys['KeyW'] || state.keys['ArrowUp']) my -= 1;
    if (state.keys['KeyS'] || state.keys['ArrowDown']) my += 1;
    if (state.keys['KeyA'] || state.keys['ArrowLeft']) mx -= 1;
    if (state.keys['KeyD'] || state.keys['ArrowRight']) mx += 1;
    const mlen = Math.hypot(mx, my);
    
    let currentSpeed = p.speed;
    if (state.buffs.speed > 0) currentSpeed *= 1.5;

    if (mlen > 0) {
      p.x += (mx/mlen) * currentSpeed * dt;
      p.y += (my/mlen) * currentSpeed * dt;
    }
    p.x = Math.max(p.r, Math.min(W - p.r, p.x));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y));

    // Бомбы
    for (let i = state.items.length - 1; i >= 0; i--) {
      const item = state.items[i];
      item.pulse += dt * 5;
      if (Math.hypot(p.x - item.x, p.y - item.y) < p.r + item.r) {
        explodeItem(item);
        state.items.splice(i, 1);
      }
    }

    // Аптечки
    for (let i = state.medkits.length - 1; i >= 0; i--) {
      const mk = state.medkits[i];
      mk.pulse += dt * 5;
      if (Math.hypot(p.x - mk.x, p.y - mk.y) < p.r + mk.r) {
        state.hp = Math.min(state.maxHp, state.hp + 30);
        AudioEngine.playMedkit();
        for (let k = 0; k < 15; k++) {
          state.particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 0.6, maxLife: 0.6, color: '#4ade80' });
        }
        state.medkits.splice(i, 1);
        syncHud();
      }
    }

    // Перки (Усиления)
    for (let i = state.perks.length - 1; i >= 0; i--) {
      const perk = state.perks[i];
      perk.pulse += dt * 5;
      if (Math.hypot(p.x - perk.x, p.y - perk.y) < p.r + perk.r) {
        state.buffs[perk.type] = 15; // 15 секунд
        AudioEngine.playPerk();
        for (let k = 0; k < 15; k++) {
          state.particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 0.6, maxLife: 0.6, color: '#d946ef' });
        }
        state.perks.splice(i, 1);
      }
    }

    if (state.mouse.down) shoot();

    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        state.bullets.splice(i, 1);
      }
    }

    // Обычные зомби
    for (let i = state.zombies.length - 1; i >= 0; i--) {
      const z = state.zombies[i];
      const dx = p.x - z.x, dy = p.y - z.y;
      const d = Math.hypot(dx, dy) || 1;
      z.x += (dx/d) * z.speed * dt;
      z.y += (dy/d) * z.speed * dt;
      z.hitFlash = Math.max(0, z.hitFlash - dt * 4);

      if (d < z.r + p.r) {
        let finalDmg = z.dmg;
        if (state.buffs.armor > 0) finalDmg *= 0.5; // Броня
        state.hp -= finalDmg * dt * 0.9;
        
        const now = performance.now();
        if (now - state.lastHitSoundTime > 500) {
          AudioEngine.playHit();
          state.lastHitSoundTime = now;
        }
        if (state.hp <= 0) { state.hp = 0; gameOver(); }
      }

      for (let j = state.bullets.length - 1; j >= 0; j--) {
        const b = state.bullets[j];
        if (Math.hypot(b.x - z.x, b.y - z.y) < z.r + b.r) {
          z.hp -= b.dmg;
          z.hitFlash = 1;
          state.bullets.splice(j, 1);
          for (let k = 0; k < 5; k++) {
            state.particles.push({ x: z.x, y: z.y, vx: (Math.random()-0.5)*160, vy: (Math.random()-0.5)*160, life: 0.4, maxLife: 0.4, color: state.frenzyActive ? '#ff6b6b' : '#7cff7c' });
          }
          if (z.hp <= 0) {
            state.kills++;
            state.zombies.splice(i, 1);
            AudioEngine.playZombieDeath();
            checkProgress();
            syncHud();
          }
          break;
        }
      }
    }

    // БОСС ФРИЧ
    if (state.boss) {
      const b = state.boss;
      const dx = p.x - b.x, dy = p.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      
      if (d > 100) { // Не прилипает вплотную
        b.x += (dx/d) * b.speed * dt;
        b.y += (dy/d) * b.speed * dt;
      }
      
      b.hitFlash = Math.max(0, b.hitFlash - dt * 4);
      b.attackTimer -= dt;

      // Атака молниями
      if (b.attackTimer <= 0) {
        b.attackTimer = 2.5; // Каждые 2.5 сек
        AudioEngine.playLightning();
        
        // Создаем 3 удара молний
        for (let k = 0; k < 3; k++) {
          state.lightningStrikes.push({
            x: p.x + (Math.random() - 0.5) * 300,
            y: p.y + (Math.random() - 0.5) * 300,
            timer: 1.0, // 1 сек до удара
            maxTimer: 1.0,
            struck: false
          });
        }
      }

      // Коллизия с игроком
      if (d < b.r + p.r) {
        let finalDmg = b.dmg;
        if (state.buffs.armor > 0) finalDmg *= 0.5;
        state.hp -= finalDmg * dt;
        if (state.hp <= 0) { state.hp = 0; gameOver(); }
      }

      // Коллизия с пулями
      for (let j = state.bullets.length - 1; j >= 0; j--) {
        const blt = state.bullets[j];
        if (Math.hypot(blt.x - b.x, blt.y - b.y) < b.r + blt.r) {
          b.hp -= blt.dmg;
          b.hitFlash = 1;
          state.bullets.splice(j, 1);
          ui.bossBarFill.style.width = Math.max(0, (b.hp / b.maxHp) * 100) + '%';
          for (let k = 0; k < 5; k++) {
            state.particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, life: 0.5, maxLife: 0.5, color: '#ff5c5c' });
          }
          if (b.hp <= 0) {
            state.boss = null;
            ui.bossHud.style.display = 'none';
            AudioEngine.playExplosion();
            state.screenFlash = 1.5;
            state.cameraShake = 3;
            // Награда за босса
            state.kills += 10;
            for (let k = 0; k < 50; k++) {
              state.particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*400, vy: (Math.random()-0.5)*400, life: 1.5, maxLife: 1.5, color: '#ffaa00' });
            }
          }
        }
      }
    }

    // Обработка ударов молний
    for (let i = state.lightningStrikes.length - 1; i >= 0; i--) {
      const ls = state.lightningStrikes[i];
      ls.timer -= dt;
      
      if (ls.timer <= 0 && !ls.struck) {
        ls.struck = true;
        AudioEngine.playExplosion(); // Звук удара
        
        // Проверка на урон игроку
        const distToPlayer = Math.hypot(p.x - ls.x, p.y - ls.y);
        if (distToPlayer < 60) {
          let finalDmg = 35;
          if (state.buffs.armor > 0) finalDmg *= 0.5;
          state.hp -= finalDmg;
          state.screenFlash = 1;
          state.cameraShake = 2;
          if (state.hp <= 0) { state.hp = 0; gameOver(); }
        }
        
        // Визуальные частицы
        for (let k = 0; k < 20; k++) {
          state.particles.push({ x: ls.x, y: ls.y, vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300, life: 0.6, maxLife: 0.6, color: '#00ffff' });
        }
      }
      
      if (ls.timer <= -0.5) { // Держим эффект полсекунды после удара
        state.lightningStrikes.splice(i, 1);
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }

    state.waveTimer += dt;
    state.spawnTimer -= dt;
    const spawnInterval = Math.max(0.15, 1.1 - state.wave * 0.06);
    if (state.spawnTimer <= 0) {
      spawnZombie();
      if (state.wave > 5 && Math.random() < 0.4) spawnZombie();
      state.spawnTimer = spawnInterval;
    }

    // Смена волны
    if (state.waveTimer > 18) {
      state.waveTimer = 0;
      state.wave++;
      
      // СПАВН БОССА НА 10 ВОЛНЕ
      if (state.wave === 10 && !state.boss) {
        spawnBoss();
      } else {
        state.hp = Math.min(state.maxHp, state.hp + 12);
      }
      syncHud();
    }

    // Таймеры спавна предметов
    state.itemTimer -= dt;
    if (state.itemTimer <= 0 && state.items.length < 4) {
      spawnItem();
      state.itemTimer = 6 + Math.random() * 6;
    }

    state.medkitTimer -= dt;
    if (state.medkitTimer <= 0 && state.medkits.length < 3) {
      spawnMedkit();
      state.medkitTimer = 15 + Math.random() * 10;
    }

    state.perkTimer -= dt;
    if (state.perkTimer <= 0 && state.perks.length < 2) {
      spawnPerk();
      state.perkTimer = 20 + Math.random() * 10;
    }

    syncHud();
  }

  function activateFrenzy() {
    AudioEngine.playFrenzy();
    state.frenzyActive = true;
    state.frenzyTime = 15;
    state.nextBonusKill += 20;
    state.screenFlash = 1;
    state.cameraShake = 1.5;
  }

  function gameOver() {
    state.over = true;
    state.running = false;
    AudioEngine.stopMusic();
    
    ui.finalKills.textContent = state.kills;
    ui.finalWave.textContent = state.wave;
    ui.gameover.classList.remove('hidden');
    ui.hud.style.display = 'none';
    ui.bossHud.style.display = 'none';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (state.cameraShake > 0) {
      ctx.translate((Math.random()-0.5) * state.cameraShake * 10, (Math.random()-0.5) * state.cameraShake * 10);
    }

    // Сетка
    ctx.strokeStyle = 'rgba(80,140,80,.10)';
    ctx.lineWidth = 1;
    const g = 40;
    for (let x = 0; x < W; x += g) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += g) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Частицы
    for (const pt of state.particles) {
      const a = pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Бомбы
    for (const item of state.items) {
      const pulse = 1 + Math.sin(item.pulse) * 0.2;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(item.x, item.y, item.r * pulse, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#ff5c5c';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#ff5c5c';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', item.x, item.y);
    }

    // Аптечки
    for (const mk of state.medkits) {
      const pulse = 1 + Math.sin(mk.pulse) * 0.15;
      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(mk.x - mk.r * pulse, mk.y - mk.r * pulse, mk.r * 2 * pulse, mk.r * 2 * pulse);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.strokeRect(mk.x - mk.r * pulse, mk.y - mk.r * pulse, mk.r * 2 * pulse, mk.r * 2 * pulse);
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(mk.x - 2, mk.y - 6, 4, 12);
      ctx.fillRect(mk.x - 6, mk.y - 2, 12, 4);
    }

    // Перки
    for (const perk of state.perks) {
      const pulse = 1 + Math.sin(perk.pulse) * 0.2;
      ctx.fillStyle = '#d946ef';
      ctx.shadowColor = '#d946ef';
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(perk.x, perk.y, perk.r * pulse, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (perk.type === 'speed') ctx.fillText('👟', perk.x, perk.y);
      if (perk.type === 'armor') ctx.fillText('🛡️', perk.x, perk.y);
      if (perk.type === 'damage') ctx.fillText('🔫', perk.x, perk.y);
      if (perk.type === 'firerate') ctx.fillText('💥', perk.x, perk.y);
    }

    // Молнии (предупреждение)
    for (const ls of state.lightningStrikes) {
      if (!ls.struck) {
        ctx.beginPath();
        ctx.arc(ls.x, ls.y, 60, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255, 0, 0, ${0.2 + Math.sin(state.t * 20) * 0.1})`;
        ctx.fill();
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        // Сам удар
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(ls.x, ls.y - 300);
        ctx.lineTo(ls.x - 10, ls.y - 150);
        ctx.lineTo(ls.x + 15, ls.y - 80);
        ctx.lineTo(ls.x - 5, ls.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // Пули
    for (const b of state.bullets) {
      ctx.fillStyle = state.frenzyActive ? '#ffaa00' : '#ffe066';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }

    // Зомби
    for (const z of state.zombies) {
      ctx.fillStyle = z.hitFlash > 0 ? '#ffffff' : '#5cbf5c';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#2a5a2a';
      ctx.lineWidth = 2;
      ctx.stroke();
      const w = z.r * 2;
      const hpFrac = z.hp / z.maxHp;
      ctx.fillStyle = '#3a0f0f';
      ctx.fillRect(z.x - z.r, z.y - z.r - 8, w, 4);
      ctx.fillStyle = '#ff5c5c';
      ctx.fillRect(z.x - z.r, z.y - z.r - 8, w * hpFrac, 4);
      ctx.fillStyle = '#0b0f0b';
      ctx.beginPath(); ctx.arc(z.x - z.r*0.35, z.y - z.r*0.15, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + z.r*0.35, z.y - z.r*0.15, 2.2, 0, Math.PI*2); ctx.fill();
    }

    // БОСС ФРИЧ
    if (state.boss) {
      const b = state.boss;
      ctx.fillStyle = b.hitFlash > 0 ? '#ffffff' : '#8b0000';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 4;
      ctx.stroke();
      
      // Глаза босса
      ctx.fillStyle = '#ffff00';
      ctx.beginPath(); ctx.arc(b.x - 15, b.y - 10, 6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(b.x + 15, b.y - 10, 6, 0, Math.PI*2); ctx.fill();
      
      // Рот
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y + 10, 15, 0, Math.PI); ctx.stroke();
    }

    // Игрок
    const p = state.player;
    if (state.frenzyActive) {
      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur = 20;
    }
    ctx.fillStyle = state.frenzyActive ? '#ff4d4d' : '#4aa8ff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.strokeStyle = state.frenzyActive ? '#aa0000' : '#1b5a99';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Визуализация активных баффов (аура)
    if (state.buffs.armor > 0) {
      ctx.strokeStyle = 'rgba(100, 200, 255, 0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI*2); ctx.stroke();
    }
    if (state.buffs.speed > 0) {
      ctx.strokeStyle = 'rgba(100, 255, 100, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    const dx = state.mouse.x - p.x, dy = state.mouse.y - p.y;
    const len = Math.hypot(dx, dy) || 1;
    ctx.strokeStyle = state.frenzyActive ? '#ffcc00' : '#bfe3ff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + dx/len * (p.r + 10), p.y + dy/len * (p.r + 10));
    ctx.stroke();

    ctx.strokeStyle = state.frenzyActive ? 'rgba(255,100,100,.8)' : 'rgba(255,255,255,.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(state.mouse.x, state.mouse.y, 7, 0, Math.PI*2);
    ctx.moveTo(state.mouse.x - 12, state.mouse.y);
    ctx.lineTo(state.mouse.x + 12, state.mouse.y);
    ctx.moveTo(state.mouse.x, state.mouse.y - 12);
    ctx.lineTo(state.mouse.x, state.mouse.y + 12);
    ctx.stroke();

    // Полоска здоровья игрока
    const barW = 220, barH = 14;
    const bx = 16, by = H - 30;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = state.hp > 30 ? '#4ade80' : '#f87171';
    ctx.fillRect(bx, by, barW * (state.hp / state.maxHp), barH);
    ctx.strokeStyle = '#2a3a2a';
    ctx.strokeRect(bx, by, barW, barH);

    ctx.restore();

    if (state.screenFlash > 0) {
      ctx.fillStyle = `rgba(255, 50, 50, ${state.screenFlash * 0.4})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  draw();
})();
</script>
